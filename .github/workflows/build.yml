name: Build Bone Boost
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: BoneBoost-VST3
          path: build/BoneBoost_artefacts/Release/VST3/
